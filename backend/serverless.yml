service: trainer-toolbox

provider:
  name: tencent
  runtime: Python3.10
  region: ap-shanghai
  stage: ${opt:stage, 'dev'}

functions:
  api:
    handler: handler.main_handler
    events:
      - apigw:
          path: /user/login
          method: post
      - apigw:
          path: /user/profile
          method: get
      - apigw:
          path: /user/profile
          method: post
      - apigw:
          path: /user/profile
          method: put
      - apigw:
          path: /user/feedback
          method: post
      - apigw:
          path: /user/stats
          method: get

      - apigw:
          path: /plan/create
          method: post
      - apigw:
          path: /plan/update/{planId}
          method: put
      - apigw:
          path: /plan/delete/{planId}
          method: delete
      - apigw:
          path: /plan/list
          method: get
      - apigw:
          path: /plan/detail/{planId}
          method: get
      - apigw:
          path: /plan/confirm/{planId}
          method: post

      - apigw:
          path: /activity/create
          method: post
      - apigw:
          path: /activity/update/{activityId}
          method: put
      - apigw:
          path: /activity/delete/{activityId}
          method: delete
      - apigw:
          path: /activity/list
          method: get
      - apigw:
          path: /activity/detail/{activityId}
          method: get
      - apigw:
          path: /activity/favorite/{activityId}
          method: post

      - apigw:
          path: /live/start
          method: post
      - apigw:
          path: /live/end
          method: post
      - apigw:
          path: /live/checkin
          method: post
      - apigw:
          path: /live/checkin-list
          method: get
      - apigw:
          path: /live/checkin/list
          method: get
      - apigw:
          path: /live/group
          method: post
      - apigw:
          path: /live/score
          method: post
      - apigw:
          path: /live/pick
          method: post

      - apigw:
          path: /review/start
          method: post
      - apigw:
          path: /review/save/{reviewId}
          method: post
      - apigw:
          path: /review/detail/{reviewId}
          method: get
      - apigw:
          path: /review/list
          method: get

      - apigw:
          path: /feedback/submit
          method: post
      - apigw:
          path: /feedback/stats
          method: get
      - apigw:
          path: /feedback/list
          method: get

      - apigw:
          path: /note/list
          method: get
      - apigw:
          path: /note/save
          method: post
